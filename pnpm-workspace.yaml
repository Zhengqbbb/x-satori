ignoreWorkspaceRootCheck: true
shellEmulator: false
allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true
publicHoistPattern:
  - "*vite*"
  - "*eslint*"
  - "*@vue*"
  - "*@astro*"

overrides:
  x-satori: "workspace:*"
packages:
  - examples/**/*
  - playground/**/*
catalogs:
  core:
    esbuild: "^0.28.0"
    minimist: "^1.2.8"
    satori: "^0.26.0"
    satori-html: "^0.3.2"
  framework:
    astro: "^6.3.3"
    vue: "^3.5.34"
    vite: "~7.3.3"
  dev:
    "@antfu/eslint-config": "^9.0.0"
    "@resvg/resvg-js-cli": "^2.6.2-beta.1"
    "@types/minimist": "^1.2.5"
    "@types/node": "~24.12.4"
    bumpp: "^11.1.0"
    eslint: "^10.4.0"
    eslint-plugin-astro: "^1.7.0"
    lint-staged: "^17.0.4"
    npm-run-all2: "^8.0.4"
    pathe: "^2.0.3"
    pnpm: "^11.1.2"
    czg: "^1.13.1"
    simple-git-hooks: "^2.13.1"
    tsdown: "^0.22.0"
    tsx: "^4.22.0"
    typescript: "^6.0.3"
